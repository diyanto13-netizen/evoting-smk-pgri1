    <script>
      // Compatibility shim for browser extensions that attempt to set window.fetch
      (function() {
        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          // Ensure window.fetch has both a getter and a setter so extension monkey-patching succeeds without throwing
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // If window.fetch cannot be reconfigured, ignore
        }

        // Suppress external browser extension unhandled exceptions
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.includes('chrome-extension://')) ||
            (event.error && event.error.stack && event.error.stack.includes('chrome-extension://'))
          ) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
